name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Perf baseline (100 frames 64×64)
        working-directory: src-tauri
        run: cargo test perf_synthetic_import_100_frames -- --nocapture

  build-linux:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const tagVersion = process.env.RELEASE_TAG.replace(/^v/, '');
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauriVersion = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargoVersion = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          const versions = { package: packageVersion, tauri: tauriVersion, cargo: cargoVersion, tag: tagVersion };
          if (new Set(Object.values(versions)).size !== 1) {
            console.error('Version mismatch:', versions);
            process.exit(1);
          }
          console.log(`Publishing GifForge ${tagVersion}`);
          NODE

      - name: Build Tauri bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: gifforge-linux
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-linux
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux bundles
        uses: actions/download-artifact@v4
        with:
          name: gifforge-linux
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GifForge ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/**/*
          fail_on_unmatched_files: true
